name: Build

# Two runners, because there is no cross-compiling a frozen app: PyInstaller
# packages the interpreter and libraries of the machine it runs on, so the
# Windows installer has to be built on Windows and the Linux packages on Linux.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The sync-engine suite is headless, but the GUI import check below is
        # not - offscreen gives Qt a platform plugin without needing a display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Check the GUI imports and renders
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m src.gui --selftest

  build:
    name: Package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04, not latest: an AppImage still links against the host glibc, so
        # one built on a newer Ubuntu refuses to start on an older one.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            libfontconfig1 desktop-file-utils fakeroot

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # One place, one mechanism. A workflow-level `env:` block would have been
      # tidier to look at, but env blocks take precedence over values written to
      # GITHUB_ENV, so a workflow-level default would silently win over the
      # version resolved here and ship an installer with an empty version in its
      # filename.
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DRIFTGRAM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "DRIFTGRAM_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          # The build runs the frozen app's --selftest, which needs a platform
          # plugin; CI runners have no display.
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py --installer

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: driftgram-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: driftgram-linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true
